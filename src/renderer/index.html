<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file://*; style-src 'self'; img-src 'self' file://*; connect-src 'self' file://*;"
    />
    <title>ANU</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="../ui/ui.css" />
    <link rel="stylesheet" href="../ui/pill/pill.css" />
    <link rel="stylesheet" href="../ui/bubble/bubble.css" />
  </head>
  <body data-state="idle" data-rings="soft" data-ears="rest">
    <main id="stage">
      <div id="character" data-hit></div>

      <div id="bubble" class="bubble" data-visible="false" data-pinned="false" data-hit>
        <p id="bubble-text"></p>
        <div id="bubble-receipt" hidden></div>
      </div>

      <section id="card" class="card" hidden data-hit>
        <header class="card-head">
          <span>ANU</span>
          <button id="card-close" type="button" aria-label="Close card">&times;</button>
        </header>
        <div id="card-body" class="card-body"></div>
        <div id="card-receipt" class="card-receipt" hidden></div>
      </section>

      <div id="pill" class="pill" data-open="false" data-hit>
        <input
          id="pill-input"
          type="text"
          maxlength="500"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ask ANU…"
          aria-label="Ask ANU"
        />
        <div id="pill-caption" class="pill-caption" hidden></div>
      </div>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/text.js"></script>
    <script src="../state/anuState.js"></script>
    <script src="../services/askAnu.js"></script>
    <script type="module" src="../ui/app.js"></script>
  </body>
</html>
